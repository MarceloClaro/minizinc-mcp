[build-system]\nrequires = ["setuptools>=70", "wheel"]\nbuild-backend = "setuptools.build_meta"\n\n[project]\nname = "minizinc-qcaf-mcp"\nversion = "0.1.0"\ndescription = "MiniZinc MCP server with Quantum Constraint Admissibility Framework (QCAF)"\nreadme = "README.md"\nrequires-python = ">=3.11"\nlicense = {text = "MIT"}\nauthors = [{name = "Marcelo Claro"}]\ndependencies = ["mcp>=1.0", "minizinc>=0.10", "pydantic>=2.7,<3"]\n\n[project.optional-dependencies]\ndev = ["pytest>=8.0", "pytest-asyncio>=0.23"]\n\n[project.scripts]\nminizinc-qcaf-mcp = "main:run_stdio"\nminizinc-qcaf-mcp-sse = "main:run_sse"\n\n[tool.setuptools]\npy-modules = ["main", "qcaf"]\n