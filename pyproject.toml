[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minizinc-qcaf-mcp"
version = "0.1.0"
description = "MiniZinc MCP server with Quantum Constraint Admissibility Framework (QCAF)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Marcelo Claro"}]
dependencies = [
  "mcp>=1.0",
  "minizinc>=0.10",
  "pydantic>=2.7,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23"
]

[project.scripts]
minizinc-qcaf-mcp = "main:run_stdio"
minizinc-qcaf-mcp-sse = "main:run_sse"

[tool.setuptools]
py-modules = ["main", "qcaf", "notebook_factory"]
